<mat-sidenav-container class="shell-container">

  <mat-sidenav mode="side" opened [disableClose]="true">
    <div class="sidenav-content">

      <div class="brand">
        <div class="brand-icon">M</div>
        <div>
          <div class="brand-name">MediaHub</div>
          <div class="brand-sub">CMS Platform</div>
        </div>
      </div>

      <div class="nav-section-label">Navigation</div>
      <mat-nav-list>
        @for (item of navItems(); track item.route) {
          <a mat-list-item [routerLink]="item.route" routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }">
            <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>

      <div class="nav-section-label spaced">Account</div>
      <mat-nav-list>
        <a mat-list-item (click)="logout()" class="clickable">
          <mat-icon class="nav-icon">logout</mat-icon>
          <span>Sign out</span>
        </a>
      </mat-nav-list>

      <div class="spacer"></div>

      <div class="user-section">
        <div class="user-avatar" [style.background]="roleColor + '22'" [style.color]="roleColor">
          {{ initials() }}
        </div>
        <div class="user-text">
          <div class="user-name">{{ auth.currentUser()?.username }}</div>
          <div class="user-role">{{ roleName() }}</div>
        </div>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      <span class="topbar-title">{{ pageTitle() }}</span>
      <span class="topbar-spacer"></span>
      <span class="topbar-email">{{ auth.currentUser()?.email }}</span>
    </mat-toolbar>

    <div class="page-wrap">
      <router-outlet />
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>
